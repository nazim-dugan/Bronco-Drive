<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bronco Drive</title>
<style>
:root{--fg:#1f2a30;--chip:#ffffffcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#bcd9ee;font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:var(--fg);background:var(--chip);border:1px solid #6668;border-radius:22px;padding:9px 16px;font-size:15px;touch-action:none}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:8px}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;font-size:26px;color:#fff;text-shadow:0 1px 4px #0008}
#hud small{font-size:14px;opacity:.85}
#bar{position:fixed;left:0;right:0;bottom:0;padding:24px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dash dash dash" "wheel drv pedals";align-items:end;gap:6px 10px;background:linear-gradient(#0b0d1000,#0b0d10b8 28%)}
#dash{grid-area:dash;display:flex;justify-content:center;align-items:center;gap:8px}
#dash canvas{width:min(34vw,150px);height:auto;aspect-ratio:1;background:#161a20e6;border-radius:50%;border:1px solid #2a313b}
#mid{display:flex;flex-direction:column;align-items:center;gap:4px}
#gear{font:700 30px system-ui,sans-serif;color:#4cc3ff;text-shadow:0 1px 4px #000}
#sel{display:grid;grid-template-columns:repeat(3,34px);gap:3px}
#sel button{padding:6px 0;font:600 13px system-ui,sans-serif;border-radius:8px;background:#161a20d9;color:#e6e9ee;border-color:#2a313b}
#sel button.on{background:#4cc3ff;color:#000}
.pedals{grid-area:pedals;display:flex;gap:14px;align-items:flex-end}
@media (orientation:landscape) and (max-height:520px){#bar{grid-template-areas:"wheel drv dash pedals";grid-template-columns:auto auto 1fr auto;padding-top:14px}#dash canvas{width:min(26vh,130px)}}
.pb{width:76px;height:76px;border-radius:50%;padding:0;font-size:28px;background:#ffffff88;backdrop-filter:blur(4px)}
.pb.big{width:70px;height:130px;border-radius:18px;font-size:12px;font-weight:700;letter-spacing:1px;background:linear-gradient(to top,#27ae60d0 var(--p,0%),transparent var(--p,0%)),repeating-linear-gradient(to top,transparent 0 calc(20% - 2px),#ffffff80 calc(20% - 2px) 20%),#ffffff59}
.pb.big.on{background:linear-gradient(to top,#27ae60d0 var(--p,0%),transparent var(--p,0%)),repeating-linear-gradient(to top,transparent 0 calc(20% - 2px),#ffffff80 calc(20% - 2px) 20%),#ffffff59;transform:none}
#wheel{position:relative;grid-area:wheel;width:124px;height:124px;touch-action:none;filter:drop-shadow(0 2px 6px #0006)}
#wheel::before{content:'';position:absolute;inset:-26px -8px -26px -26px;border-radius:50%}
#wheel svg{width:100%;height:100%;display:block;pointer-events:none}
.pb.on{background:#fff;transform:scale(.94)}
#tilt{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:150px;height:10px;border-radius:6px;background:linear-gradient(90deg,#d33,#e9b21a 25%,#4caf50 40%,#4caf50 60%,#e9b21a 75%,#d33);box-shadow:0 1px 4px #0006}
#tilt i{position:absolute;top:-3px;width:6px;height:16px;border-radius:3px;background:#fff;border:1px solid #000a;transform:translateX(-50%)}
#msg{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-size:30px;text-shadow:0 2px 8px #000a}
#msg button{margin-top:12px;font-size:17px}
.help{position:fixed;left:0;right:0;bottom:260px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #0008;pointer-events:none}
#trk{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));left:12px;color:#fff;font:14px system-ui,sans-serif;text-shadow:0 1px 3px #000a}
#trk i{display:block;width:130px;height:7px;margin-top:3px;border-radius:4px;background:#0007;overflow:hidden}#trk b{display:block;height:100%;width:0;background:#e5533d}
#msg span{font-size:18px}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0d10;z-index:20;color:#fff;font-family:system-ui,sans-serif}
#menu .card{width:min(92vw,420px);max-height:92vh;overflow:auto;text-align:center}
#menu h2{margin:0 0 4px;font-size:26px}#menu p{margin:0 0 14px;color:#9aa4b2}
#lv{display:flex;flex-direction:column;gap:8px}
#lv button,#menu .rnd button{padding:12px;font-size:16px;border-radius:12px;background:#1b212a;color:#fff;border:1px solid #2f3846;text-align:left}
#lv button span{float:right;color:#e9b21a;letter-spacing:2px}
#menu .rnd{margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}#menu .rnd button{text-align:center}
#drv{grid-area:drv;justify-self:center;align-self:end;width:92px;height:92px;border-radius:22px;padding:0;font:700 40px/1 system-ui,sans-serif;background:#161a20e6;color:#8a94a3;border:2px solid #2a313b;touch-action:none}
#drv small{display:block;font-size:11px;font-weight:600;margin-top:3px;color:#8a94a3}
#drv.on{border-color:#4cc3ff;color:#4cc3ff}#drv.rev{border-color:#ff6a3d;color:#ff6a3d}
@media (max-width:460px){#wheel{width:100px;height:100px}.pb{width:64px;height:64px}.pb.big{width:60px;height:112px}#drv{width:76px;height:76px;font-size:34px}.pedals{gap:10px}#bar{gap:6px 6px}}
#drv.nope{animation:nope .35s}@keyframes nope{0%,100%{border-color:#ff4545}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#drv.wait{animation:wait .6s infinite}@keyframes wait{50%{opacity:.45}}
#mpp textarea{width:100%;box-sizing:border-box;margin-top:8px;background:#1b212a;color:#fff;border:1px solid #2f3846;border-radius:10px;padding:8px;font:12px monospace}
#mpp input{padding:10px;border-radius:10px;background:#1b212a;color:#fff;border:1px solid #2f3846;font-size:15px;width:120px}
#mpp select,#mpp button{padding:10px;border-radius:10px;background:#1b212a;color:#fff;border:1px solid #2f3846;font-size:15px;margin:4px 2px}#mpt{color:#9aa4b2;margin:6px 0}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">0 <small>km/h</small></div><div id="trk"><span id="tt"></span><i><b id="db"></b></i></div>
<div class="top"><button id="mute" aria-label="Toggle sound">🔊</button><button id="view">View: Chase</button><button id="rst">Reset</button><button id="mnu">Menu</button></div>
<div id="menu"><div class="card"><h2>🛻 Bronco Drive</h2><p>Pick a level, or drive a random path.</p><div id="lv"></div><div class="rnd">Random path: <button data-s="R1">Easy</button><button data-s="R2">Medium</button><button data-s="R3">Hard</button></div>
<div class="rnd"><button id="mp2">👥 Two players (WiFi)</button></div>
<div id="mpp" style="display:none;margin-top:10px;text-align:left"><div id="mpa"><select id="mpl"><option value="L1">1 · Sunny Meadow</option><option value="L2">2 · Rolling Hills</option><option value="L3">3 · Ridge Trail</option><option value="L4">4 · Rocky Climb</option><option value="L5">5 · Mountain Pass</option><option value="R2">Random path</option></select> <button id="mph">Host (codes)</button> <button id="mpj">Join (codes)</button>
<div style="margin:10px 0 2px;color:#9aa4b2;font-size:13px">Or use a room name (needs internet): type the same name on both phones, nothing to copy.</div><input id="mpn" placeholder="room name" autocapitalize="off"> <button id="mpqh">Host room</button> <button id="mpqj">Join room</button></div>
<div id="mpb" style="display:none"><p id="mpt"></p><textarea id="mpc" readonly rows="3"></textarea><button id="mps">Copy / share code</button><textarea id="mpr" rows="3" placeholder="Paste the other phone's code here"></textarea><button id="mpg">Connect</button></div></div></div></div>
<div id="tilt"><i></i></div><div id="msg" style="display:none"><b id="mt"></b><br><span id="ms"></span><br><button id="mb"></button> <button id="mn">New track</button></div>
<div id="bar"><div id="dash"><canvas id="dGS" width="240" height="240"></canvas><div id="mid"><div id="gear">D1</div><div id="sel"></div></div><canvas id="dGR" width="240" height="240"></canvas></div><div id="wheel" role="slider" aria-label="Steering wheel"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#ffffff44"/><g stroke="#1c1c20" stroke-linecap="round"><circle cx="50" cy="50" r="41" fill="none" stroke-width="9"/><line x1="9" y1="50" x2="91" y2="50" stroke-width="7"/><line x1="50" y1="50" x2="50" y2="91" stroke-width="7"/></g><circle cx="50" cy="50" r="13" fill="#2c2c32"/><rect x="46" y="5" width="8" height="9" rx="2" fill="#d1101c"/></svg></div>
<button id="drv" aria-label="Switch between drive and reverse"><span id="drvL">D</span><small>D ⇄ R</small></button>
<div class="pedals"><button class="pb" data-k="brake" aria-label="Brake">▼</button><button class="pb big" data-k="gas" aria-label="Accelerate: press higher on the pedal for more gas">GAS</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ---- launcher: the menu runs on this page, every level runs in its own iframe (no page reloads, so it also works from a downloaded file) ----
const SRC='<!doctype html>'+document.documentElement.outerHTML;
const SEL0=window.__SEL!==undefined?window.__SEL:(/^(L[1-5]|R[1-3])$/.test(location.hash.slice(1))?location.hash.slice(1):null);
let bdFrame=null;const menuEl0=document.getElementById('menu');
function bdLaunch(sel,seed,mp){if(bdFrame)bdFrame.remove();bdFrame=document.createElement('iframe');
 bdFrame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:30;background:#000';bdFrame.setAttribute('allow','autoplay');
 bdFrame.onload=()=>{try{bdFrame.contentWindow.focus()}catch(e){}};
 bdFrame.srcdoc=SRC.replace('<head>','<head><script>window.__SEL="'+sel+'";'+(seed!==undefined?'window.__SEED='+seed+';':'')+(mp?'window.__MP=1;':'')+'<\/script>');
 document.body.appendChild(bdFrame);menuEl0.style.display='none'}
addEventListener('message',e=>{const d=e.data;if(!d||!d.bd)return;
 if(d.bd==='go')bdLaunch(d.sel);else if(d.bd==='net'&&bdFrame&&e.source===bdFrame.contentWindow)mpFromGame(d.m);
 else if(d.bd==='menu'){if(MP.dc){send({t:'left'});mpClose()}mpReset();if(bdFrame){bdFrame.remove();bdFrame=null;menuEl0.style.display='flex'}else{try{location.hash=''}catch(x){}location.reload()}}});
if(SEL0===null){const lv=document.getElementById('lv');
 ['Sunny Meadow','Rolling Hills','Ridge Trail','Rocky Climb','Mountain Pass'].forEach((n,i)=>{const b=document.createElement('button');
  b.innerHTML='<b>'+(i+1)+'</b> '+n+' <span>'+'\u2605'.repeat(i+1)+'\u2606'.repeat(4-i)+'</span>';b.onclick=()=>bdLaunch('L'+(i+1));lv.appendChild(b)});
 menuEl0.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>bdLaunch(b.dataset.s));menuEl0.style.display='flex'}

// ---- two players: WebRTC data channel; the phones pair by exchanging two short codes (no server) ----
const MP={pc:null,dc:null,role:'',sel:'L1',seed:0,rdy:0,mode:''};
const mpStat=t=>{const e=document.getElementById('mpt');if(e)e.textContent=t};
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function pipe(u8,C){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new C('deflate-raw'))).arrayBuffer())}
const enc=async d=>b64(await pipe(new TextEncoder().encode(JSON.stringify({t:d.type,s:d.sdp})),CompressionStream));
const rd=async c=>{const d=JSON.parse(new TextDecoder().decode(await pipe(unb64(c.trim()),DecompressionStream)));return{type:d.t,sdp:d.s}};
const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();pc.addEventListener('icegatheringstatechange',()=>pc.iceGatheringState==='complete'&&r());setTimeout(r,3500)});
const send=m=>{if(MP.dc&&MP.dc.readyState==='open')MP.dc.send(JSON.stringify(m))};
const toGame=m=>{try{bdFrame&&bdFrame.contentWindow.postMessage({bdnet:m},'*')}catch(e){}};
function mpClose(){try{MP.dc&&MP.dc.close();MP.pc&&MP.pc.close();MP.peer&&MP.peer.destroy()}catch(e){}MP.pc=MP.dc=MP.peer=null;MP.rdy=0}
function mkPc(){mpClose();const pc=MP.pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))toGame({t:'left'})};return pc}
function setDc(dc){MP.dc=dc;
 dc.onopen=()=>{mpStat('Connected!');if(MP.role==='host'){send({t:'start',sel:MP.sel,seed:MP.seed});bdLaunch(MP.sel,MP.seed,1)}};
 dc.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='start')bdLaunch(m.sel,m.seed,1);else if(m.t==='ready'){MP.rdy|=2;chkGo()}else toGame(m)}}
function chkGo(){if(MP.rdy===3){MP.rdy=0;send({t:'go'});toGame({t:'go'})}}
function mpFromGame(m){if(m.t==='ready'&&MP.role==='host'){MP.rdy|=1;chkGo()}else send(m)}
async function mpHost(sel){const pc=mkPc();MP.role='host';MP.sel=sel;MP.seed=(Math.random()*1e9)|0;setDc(pc.createDataChannel('g'));await pc.setLocalDescription(await pc.createOffer());await gathered(pc);return enc(pc.localDescription)}
async function mpJoin(code){const pc=mkPc();MP.role='guest';pc.ondatachannel=e=>setDc(e.channel);await pc.setRemoteDescription(await rd(code));await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);return enc(pc.localDescription)}
const mpShow=(id,v)=>{document.getElementById(id).style.display=v?'block':'none'};
function mpReset(){mpShow('mpp',0);mpShow('mpa',1);mpShow('mpb',0)}
{const $=id=>document.getElementById(id);
 $('mp2').onclick=()=>mpShow('mpp',1);
 $('mph').onclick=async()=>{mpShow('mpa',0);mpShow('mpb',1);['mpc','mps','mpr','mpg'].forEach(i=>mpShow(i,0));MP.mode='host';mpStat('Creating code...');
  try{$('mpc').value=await mpHost($('mpl').value);['mpc','mps','mpr','mpg'].forEach(i=>mpShow(i,1));mpStat('1) Send this code to the other phone. 2) Paste its reply code below and tap Connect.')}catch(e){mpStat('Could not create a code: '+e.message)}};
 $('mpj').onclick=()=>{mpShow('mpa',0);mpShow('mpb',1);['mpc','mps'].forEach(i=>mpShow(i,0));['mpr','mpg'].forEach(i=>mpShow(i,1));MP.mode='join';mpStat('Paste the code from the host phone, then tap Connect.')};
 $('mpg').onclick=async()=>{const v=$('mpr').value;
  try{if(MP.mode==='host'){await mpAccept(v);mpStat('Connecting... keep both phones on the same WiFi.');
    setTimeout(()=>{if(!MP.dc||MP.dc.readyState!=='open')mpStat('Could not connect. Both phones must be on the same WiFi (not a guest network). Go back and try again.')},20000)}
   else{mpStat('Working...');$('mpc').value=await mpJoin(v);['mpc','mps'].forEach(i=>mpShow(i,1));['mpr','mpg'].forEach(i=>mpShow(i,0));mpStat('Send this reply code back to the host. The game starts when it connects.')}}
  catch(e){mpStat('That code did not work: '+e.message)}};
 try{$('mpn').value=localStorage.getItem('bd-room')||''}catch(e){}
 const quick=h=>()=>{mpShow('mpa',0);mpShow('mpb',1);['mpc','mps','mpr','mpg'].forEach(i=>mpShow(i,0));mpQuick(h,$('mpl').value)};
 $('mpqh').onclick=quick(true);$('mpqj').onclick=quick(false);
 $('mps').onclick=async()=>{const c=$('mpc').value;try{if(navigator.share)await navigator.share({text:c});else{await navigator.clipboard.writeText(c);mpStat('Copied.')}}catch(e){$('mpc').select()}}}
// room-name mode: PeerJS public signalling service pairs the phones by name; the game data still goes phone to phone
const roomId=()=>{const n=document.getElementById('mpn').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');try{localStorage.setItem('bd-room',n)}catch(e){}return n?'bronco-drive-'+n:''};
function peerDc(conn){const dc={get readyState(){return conn.open?'open':'closed'},send:s=>conn.send(s),close:()=>{try{conn.close()}catch(e){}}};
 conn.on('open',()=>dc.onopen&&dc.onopen());conn.on('data',d=>dc.onmessage&&dc.onmessage({data:d}));conn.on('close',()=>toGame({t:'left'}));return dc}
function mpQuick(host,sel){
 if(typeof Peer==='undefined'){mpStat('Room names need internet and the PeerJS library, which is not available here. Use the codes instead.');return}
 const id=roomId();if(!id){mpStat('Type a room name first.');return}
 mpClose();MP.role=host?'host':'guest';MP.sel=sel;MP.seed=(Math.random()*1e9)|0;
 const peer=MP.peer=host?new Peer(id):new Peer();mpStat(host?'Opening the room...':'Looking for the room...');
 peer.on('error',e=>mpStat(e.type==='unavailable-id'?'That room name is already in use. Join it, or pick another name.':e.type==='peer-unavailable'?'Nobody is hosting that room yet. Ask the host to open it first.':'Connection problem: '+e.type));
 peer.on('open',()=>{if(host)mpStat('Room is open. On the other phone, join the same room name.');else setDc(peerDc(peer.connect(id,{reliable:true})))});
 peer.on('connection',c=>{const d=peerDc(c);setDc(d);if(c.open)d.onopen()})}
async function mpAccept(c){await MP.pc.setRemoteDescription(await rd(c))}
function __game(){
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const S=new THREE.Scene();S.background=new THREE.Color(0xbcd9ee);S.fog=new THREE.Fog(0xbcd9ee,70,280);
const C=new THREE.PerspectiveCamera(62,1,.1,600);
S.add(new THREE.HemisphereLight(0xffffff,0x8a7a60,.95));
const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);
Object.assign(dl.shadow.camera,{left:-12,right:12,top:12,bottom:-12,far:60});dl.shadow.bias=-.0006;S.add(dl,dl.target);
// ---- car (detailed model, scaled to metres) ----
const SC=.4,carRoot=new THREE.Group(),pivot=new THREE.Group(),I=new THREE.Group(),W=[];I.scale.setScalar(SC);I.position.y=-.78;pivot.add(I);carRoot.add(pivot);S.add(carRoot);
const M=(c,r=.4,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const red=M(0xd1101c,.25,.1),blk=M(0x151517,.55),gry=M(0x6a6c70,.4,.3),org=M(0xf08a1c,.4),wht=M(0xf0f0f0,.2),blu=M(0x1f4fe0,.35),dk=M(0x050505,.9),rub=M(0x0e0e10,.95),rim=M(0x2a2a2e,.5,.2);
const add=(m,x,y,z)=>{m.position.set(x,y,z);I.add(m);return m};
const bx=(w,h,d,mat,x,y,z)=>add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat),x,y,z);
function rb(w,h,d,mat,x,y,z,r=.15){const s=new THREE.Shape(),a=-w/2,b=-h/2;r=Math.min(r,w/2,h/2);
s.moveTo(a+r,b);s.lineTo(-a-r,b);s.quadraticCurveTo(-a,b,-a,b+r);s.lineTo(-a,-b-r);s.quadraticCurveTo(-a,-b,-a-r,-b);s.lineTo(a+r,-b);s.quadraticCurveTo(a,-b,a,-b-r);s.lineTo(a,b+r);s.quadraticCurveTo(a,b,a+r,b);
const g=new THREE.ExtrudeGeometry(s,{depth:d-.1,bevelThickness:.05,bevelSize:.05,bevelSegments:2,curveSegments:6});g.translate(0,0,-(d-.1)/2);return add(new THREE.Mesh(g,mat),x,y,z)}
const cy=(r,h,mat,x,y,z,rx=0,rz=0)=>{const m=add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),mat),x,y,z);m.rotation.set(rx,0,rz);return m};
const ball=(r,mat,x,y,z,sc)=>{const m=add(new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat),x,y,z);if(sc)m.scale.set(...sc);return m};
function wheel(s,z){const w=new THREE.Group();w.position.set(2.3*s,1.15,z);
const pr=[[.62,-.5],[1,-.5],[1.12,-.38],[1.15,-.15],[1.15,.15],[1.12,.38],[1,.5],[.62,.5]].map(p=>new THREE.Vector2(p[0],p[1]));
const t=new THREE.Mesh(new THREE.LatheGeometry(pr,40),rub);t.rotation.z=Math.PI/2;w.add(t);
for(let i=0;i<28;i++){const a=i/28*Math.PI*2,k=new THREE.Mesh(new THREE.BoxGeometry(.8,.09,.2),rub);k.position.set(0,1.17*Math.cos(a),1.17*Math.sin(a));k.rotation.x=a;w.add(k)}
const h=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.9,24),rim);h.rotation.z=Math.PI/2;w.add(h);
const f=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.06,24),gry);f.rotation.z=Math.PI/2;f.position.x=.47*s;w.add(f);
for(let i=0;i<5;i++){const a=i/5*Math.PI*2,n=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.1,10),wht);n.rotation.z=Math.PI/2;n.position.set(.5*s,.32*Math.cos(a),.32*Math.sin(a));w.add(n)}
const c=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.1,16),dk);c.rotation.z=Math.PI/2;c.position.x=.52*s;w.add(c);

 if(MPG&&ok){mpSend({t:'fin',time:G.t});mss.textContent+=rm.fin==null?' \u00b7 You finished first!':(G.t<rm.fin?' \u00b7 You won!':' \u00b7 Opponent was faster')}
 mbtn.textContent=ok?'Drive again':'Try again';mnb.textContent=(ok&&!RND&&LVI<4&&!MPG)?'Next level \u25b6':'Menu';msg.style.display='block'}
mbtn.onclick=()=>resetCar();const mnb=document.getElementById('mn'),menuEl=document.getElementById('menu');
function goTo(sel){parent.postMessage({bd:sel===''?'menu':'go',sel},'*')}

(function(){const lv=document.getElementById('lv');
 LVS.forEach((L,i)=>{const b=document.createElement('button');b.innerHTML='<b>'+(i+1)+'</b> '+L.n+' <span>'+'\u2605'.repeat(i+1)+'\u2606'.repeat(4-i)+'</span>';b.onclick=()=>pick('L'+(i+1));lv.appendChild(b)});
 menuEl.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>pick(b.dataset.s));
 function pick(sel){if(MENU&&sel==='L1'){menuEl.style.display='none';resetCar()}else goTo(sel)}
 if(MENU)menuEl.style.display='flex'})();
function gameLogic(dt,up,sp){
 if(G.state==='run'){
  if(sp>1)G.go=true;if(G.go)G.t+=dt;
  const i=near(car.x,car.z);
  if(i>=0){const lt=(car.x-RX[i])*Math.cos(RA[i])-(car.z-RZ[i])*Math.sin(RA[i]);
   if(Math.abs(lt)<HW+3)G.prog=Math.max(G.prog,RS[i]/RL);
   if(i>=RN-10&&Math.abs(lt)<HW)gmEnd(true)}
  G.grace=Math.max(0,G.grace-dt);G.flip=(up<.35&&sp<4)?G.flip+dt:0;
  if(G.state==='run'&&(G.dmg>=100||G.flip>1.5))gmEnd(false)}
 gtt.textContent=(RND?'Random':'Level '+(LVI+1))+' \u00b7 '+Math.round(G.prog*100)+'% \u00b7 '+fmtT(G.t);if(MPG)gtt.textContent+=' \u00b7 Opp '+(rm.fin!=null?'\u2713':Math.round(rm.prog*100)+'%');gdb.style.width=G.dmg+'%'}
// ---- two players: remote car + race sync (messages are relayed by the launcher page) ----
const rm={has:0,p:[0,0,0],v:[0,0,0],q:new THREE.Quaternion(),at:0,prog:0,fin:null,left:0},rp=new THREE.Vector3(),rq=new THREE.Quaternion();let mpT=0,ghost=null;
const mpm=document.createElement('div');mpm.style.cssText='position:fixed;left:0;right:0;top:24%;text-align:center;color:#fff;font:700 34px system-ui,sans-serif;text-shadow:0 2px 8px #000;pointer-events:none;z-index:15;display:none';document.body.appendChild(mpm);
const mpSay=t=>{mpm.textContent=t;mpm.style.display=t?'block':'none'},mpSend=m=>parent.postMessage({bd:'net',m},'*');
if(MPG){ghost=carRoot.clone(true);ghost.visible=false;
 ghost.traverse(o=>{if(o.isMesh){o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone();(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.emissive&&m.emissive.setHex(0x0b3a8a))}});
 const mk=new THREE.Mesh(new THREE.ConeGeometry(.45,1,10),new THREE.MeshBasicMaterial({color:0x3aa0ff}));mk.rotation.x=Math.PI;mk.position.y=3;ghost.children[0].add(mk);S.add(ghost)}
function onNet(m){
 if(m.t==='pos'){rm.p=m.p;rm.v=m.v;rm.q.set(m.q[0],m.q[1],m.q[2],m.q[3]);rm.at=performance.now();rm.prog=m.pg;if(!rm.has){rm.has=1;rp.set(m.p[0],m.p[1],m.p[2]);rq.copy(rm.q);ghost.visible=true}}
 else if(m.t==='fin'){rm.fin=m.time;if(G.state==='run'){mpSay('Opponent finished!');setTimeout(()=>mpSay(''),2500)}}
 else if(m.t==='left'){rm.left=1;mpSay('Opponent left');setTimeout(()=>mpSay(''),2500)}
 else if(m.t==='go'){let n=3;G.state='wait';const tick=()=>{if(n>0){mpSay(String(n--));setTimeout(tick,1000)}else{resetCar();G.go=true;mpSay('GO!');setTimeout(()=>mpSay(''),800)}};tick()}}
addEventListener('message',e=>{if(e.data&&e.data.bdnet)onNet(e.data.bdnet)});
function mpFrame(dt){mpT+=dt;
 if(mpT>.05&&G.state!=='wait'){mpT=0;const r=v=>+v.toFixed(2);mpSend({t:'pos',p:sim.p.map(r),q:sim.q.map(v=>+v.toFixed(3)),v:sim.v.map(r),pg:+G.prog.toFixed(3)})}
 if(rm.has){const a=Math.min(1,dt*14),age=Math.min(.15,(performance.now()-rm.at)/1000);
  rp.x+=(rm.p[0]+rm.v[0]*age-rp.x)*a;rp.y+=(rm.p[1]+rm.v[1]*age-rp.y)*a;rp.z+=(rm.p[2]+rm.v[2]*age-rp.z)*a;rq.slerp(rm.q,a);
  ghost.children[0].position.copy(rp);ghost.children[0].quaternion.copy(rq)}}
// ---- page glue ----
const car={v:0,crash:false,x:0,y:0,z:0,h:0},msg=document.getElementById('msg'),tmk=document.getElementById('tilt').firstElementChild;
const wrap=a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
let acc=0,flipT=0,vPrev=[0,0,0],sndT=0,steer=0;
function resetCar(x=SX,z=SZ,h=SH,up){// spawn tilted to the ground slope, wheels just above the surface (no drop onto a hillside)
 const n=NRM(x,z),fx=Math.sin(h),fz=Math.cos(h),dd=fx*n[0]+fz*n[2];let ez=[fx-dd*n[0],-dd*n[1],fz-dd*n[2]];const el=Math.hypot(ez[0],ez[1],ez[2]);ez=ez.map(v=>v/el);
 const ex=[n[1]*ez[2]-n[2]*ez[1],n[2]*ez[0]-n[0]*ez[2],n[0]*ez[1]-n[1]*ez[0]],sq=Math.sqrt(ex[0]+n[1]+ez[2]+1)*2;
 sim.p=[x,H(x,z)+1.1,z];sim.q=[(n[2]-ez[1])/sq,(ez[0]-ex[2])/sq,(ex[1]-n[0])/sq,sq/4];sim.v=[0,0,0];sim.w=[0,0,0];sim.ws=[0,0,0,0];vPrev=[0,0,0];steer=0;flipT=0;ch=h;DR.w=94;DR.pend=null;drvUpdate(DR.sel);gmReset();msg.style.display='none'}
function crashSnd(){if(!AC||muted||AC.state!=='running')return;const n=AC.sampleRate*.7|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);
 const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const q=AC.createGain();q.gain.value=.6;s.connect(f);f.connect(q);q.connect(AC.destination);s.start()}
function step(dt){
 if(wDrag===null)wheelDeg*=Math.exp(-7*dt);
 wh.style.transform='rotate('+(wheelDeg+(keys.right-keys.left)*60)+'deg)';
 let Rm=matQ(sim.q);const fs=sim.v[0]*Rm[0][2]+sim.v[1]*Rm[1][2]+sim.v[2]*Rm[2][2];
 const lim=Math.min(.38,12/Math.max(1,fs*fs));
 steer+=(cl(keys.left-keys.right-wheelDeg/120,-1,1)*lim-steer)*Math.min(1,dt*6);
 drvFrame(dt);const inp={Tw:0,Tb:0,steer};
 acc=Math.min(acc+dt,.05);while(acc>=DT){inp.Tw=drive(DT,wavg(),sim.N[0]+sim.N[1]+sim.N[2]+sim.N[3]>500,sim.slip);inp.Tb=DR.brk*BRKT;physStep(DT,inp);acc-=DT}
 Rm=matQ(sim.q);
 pivot.position.set(sim.p[0],sim.p[1],sim.p[2]);pivot.quaternion.set(sim.q[0],sim.q[1],sim.q[2],sim.q[3]);
 W.forEach((o,k)=>{o.sp.rotation.x+=sim.spin[k]*dt/.46;o.w.position.y=(-.12-sim.dist[k]+.46+CGH)/SC;if(o.z>0)o.w.rotation.y=steer});
 const up=Rm[1][1],sp=Math.hypot(sim.v[0],sim.v[1],sim.v[2]);
 car.v=fs;car.crash=up<.35;car.x=sim.p[0];car.y=sim.p[1];car.z=sim.p[2];car.h=Math.atan2(Rm[0][2],Rm[2][2]);
 flipT=(up<.35&&sp<4)?flipT+dt:0;
 gameLogic(dt,up,sp);if(MPG)mpFrame(dt);
 const dv=Math.hypot(sim.v[0]-vPrev[0],sim.v[1]-vPrev[1],sim.v[2]-vPrev[2]);vPrev=sim.v.slice();sndT-=dt;if(dv>4)G.hit(dv);if(dv>5&&sndT<=0){crashSnd();sndT=.6}
 const Ls=sim.N[0]+sim.N[1],Rs=sim.N[2]+sim.N[3];tmk.style.left=(50-cl((Ls-Rs)/Math.max(1,Ls+Rs),-1,1)*50)+'%';
 document.getElementById('hud').firstChild.nodeValue=Math.round(sp*3.6)+' ';engine();dashUpdate(sp);
}
function cam(dt){
 const v=V[vi];ch+=wrap(car.h-ch)*Math.min(1,dt*(vi>=3?14:3));
 if(!Pt.size)yawO*=Math.exp(-1.6*dt);if(!Pt.size&&vi<3)pitO*=Math.exp(-1.6*dt);
 const a=ch+yawO;C.up.set(0,1,0);
 if(vi>=3){carRoot.updateMatrixWorld(true);const L=(x,y,z)=>pivot.localToWorld(new THREE.Vector3(x,y,z)),P=L(.36,.74,.2),U=L(.36,1.74,.2).sub(P).normalize(),p=cl(-pitO*.4,-.5,.5),
   tx=P.x+Math.sin(a)*12,tz=P.z+Math.cos(a)*12,dy=cl(H(tx,tz)-.3-P.y,-4.5,4.5); // look down at the ground ~12 m ahead, so a climb shows the road instead of the sky
  cockDy+=(dy-cockDy)*Math.min(1,dt*4);
  C.position.copy(P);C.up.copy(U).lerp(new THREE.Vector3(0,1,0),.6).normalize();C.lookAt(tx,P.y+cockDy+Math.sin(p)*12,tz)}
 else{const tx=car.x-Math.sin(a)*v.d*zoom,tz=car.z-Math.cos(a)*v.d*zoom;
  C.position.set(tx,Math.max(H(tx,tz)+.8,car.y+v.h*zoom+pitO*8),tz);C.lookAt(car.x,car.y+.4,car.z)}
 dl.position.set(car.x+10,car.y+22,car.z+8);dl.target.position.set(car.x,car.y,car.z);
}
setSel('D');resetCar();if(MENU)G.state='menu';if(MPG){G.state='wait';mpSay('Waiting for the other player...');mpSend({t:'ready'})}

(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);cam(dt);R.render(S,C)})(last);
